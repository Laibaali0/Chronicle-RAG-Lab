[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-rag-lab"
version = "0.1.0"
description = "Version-aware retrieval, citation validation and reproducible evaluation for synthetic coding-assistant documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
chronicle-rag = "chronicle_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
